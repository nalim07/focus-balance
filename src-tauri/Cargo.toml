[package]
name = "focus-balance"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.4", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.2"
tauri-plugin-sql = { version = "2.2", features = ["sqlite"] }
tauri-plugin-global-shortcut = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
